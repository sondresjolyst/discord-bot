version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: sunday
  cooldown:
    default-days: 7
  commit-message:
    prefix: deps(github-actions)
- package-ecosystem: pip
  directory: /
  schedule:
    interval: weekly
    day: sunday
  cooldown:
    default-days: 7
  commit-message:
    prefix: deps(pip)
